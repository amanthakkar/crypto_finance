name: Refresh live dashboard
# Keeps the GitHub Pages demo current on its own: recomputes the
# indicators from public data and republishes docs/. The production
# version at amanthakkar.com updates daily from the author's homelab;
# this weekly refresh is the open-source twin's heartbeat.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: crypto-finance dashboard
      - run: |
          cp outputs/dashboard.html docs/index.html
          cp outputs/dashboard.html docs/sample-output/dashboard.html
      - name: Commit if changed
        run: |
          git config user.name "Aman Thakkar"
          git config user.email "21281482+amanthakkar@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "chore: weekly dashboard refresh (automated)" && git push
